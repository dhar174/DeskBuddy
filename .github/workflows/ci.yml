name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU Gate 1 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.26'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-py${{ steps.python.outputs.python-version }}
          prune-cache: true
      - name: Install locked core and dev dependencies
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: uv sync --locked --group dev
      - name: Check lock consistency
        run: uv lock --check --offline
      - name: Pytest
        run: uv run --no-sync pytest
      - name: Ruff lint
        run: uv run --no-sync ruff check .
      - name: Mypy
        run: uv run --no-sync mypy
      - name: Ruff format
        run: uv run --no-sync ruff format --check src transport tests
